project_id = "studyspot"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
port = 54321
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "exp://localhost:8081"]
jwt_expiry = 3600
enable_email_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.on-request-approved]
verify_jwt = false

[functions.on-message-insert]
verify_jwt = false

[functions.session-lifecycle-cron]
schedule = "*/5 * * * *"
verify_jwt = false

[functions.verify-upload-url]
verify_jwt = true

[functions.admin-verify-action]
verify_jwt = true

[functions.send-session-reminders]
schedule = "* * * * *"
verify_jwt = false

[functions.streak-calculator-cron]
schedule = "0 0 * * *"
verify_jwt = false
