project_id = "studyspot"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "exp://localhost:8081"]
jwt_expiry = 3600
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# verify_jwt=false on the webhook/cron functions is intentional: they
# authenticate callers with their own shared secrets instead
# (x-webhook-secret / x-cron-secret, see functions/_shared/security.ts).
# Scheduling is NOT done here; cron jobs are configured in the Dashboard.
[functions.on-request-approved]
verify_jwt = false

[functions.on-message-insert]
verify_jwt = false

[functions.session-lifecycle-cron]
verify_jwt = false

[functions.verify-upload-url]
verify_jwt = true

[functions.admin-verify-action]
verify_jwt = true

[functions.send-session-reminders]
verify_jwt = false
